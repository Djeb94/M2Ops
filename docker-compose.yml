services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gazette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gazette_dev}
      POSTGRES_DB: gazette
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazette"]
      interval: 5s
      retries: 10

  prefect:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      retries: 20

  app:
    build: .
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      DATABASE_URL: postgresql://gazette:${POSTGRES_PASSWORD:-gazette_dev}@postgres:5432/gazette
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      prefect: { condition: service_healthy }

volumes:
  pgdata: