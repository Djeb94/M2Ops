name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint + tests (dans l'image de test)
        run: ./bin/test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (tag horodaté + sha)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          docker build --target runtime -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "Image publiée : $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"